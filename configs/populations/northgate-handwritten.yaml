# Northgate: 27 written people around one school (9 juniors, 6 seniors, 4 friends from outside
# the school, 6 family members, 2 staff). Every person fills all 10 description groups; see
# guide.md. Groups: g1 trend-loving juniors, g2 quieter juniors, g3 seniors, g4 a senior with
# outside friends, g5 the parents, g6 the staff room. Relatives are linked to their kids as family.
population:
  name: northgate-handwritten
  description: Twenty-seven written people around Northgate High - students, outside friends, family and staff.
  size: 27
  seed: 11
  cohorts:
    - {name: junior, label: junior at Northgate High, share: 0.333}
    - {name: senior, label: senior at Northgate High, share: 0.222}
    - {name: friend, label: friend from outside the school, share: 0.148}
    - {name: family, label: parent or relative of a student, share: 0.222}
    - {name: staff, label: works at Northgate High, share: 0.075}
  groups:
    weak_ties_per_agent: 2
    cross_cohort_labels:
      junior|senior: schoolmate
      family|junior: family friend
      family|senior: family friend
      friend|junior: friend
      friend|senior: friend
      junior|staff: teacher
      senior|staff: teacher
  min_trait_distance: 0.12
  budget_label: to spend on wants this month

